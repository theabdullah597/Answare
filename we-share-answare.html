  ============================================================================
  WE SHARE — Answare  |  Single-file landing page (glass / liquid-glass style)
  ============================================================================
  HOW TO EDIT THE LINKS (download button, Instagram, email):
  Scroll down to the <script> tag near the bottom of this file and find the
  block that starts with:  const CONFIG = {
  Change the values there. That is the ONLY place you need to touch.

  HOW TO USE ON BLOGGER:
  Blogger > Layout > Add a Gadget > HTML/JavaScript > paste this whole file
  into the content box. (Or Theme > Edit HTML if you want it as a full page.)

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WE SHARE — by Answare</title>
<meta name="description" content="WE SHARE: send files between your PC and any Android or iPhone over WiFi or Bluetooth. No app install, no account, no internet.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ==========================================================
     TOKENS
     ========================================================== */
  :root{
    --bg:#0b0c0f;
    --bg-soft:#111318;
    --glass-bg: rgba(255,255,255,0.055);
    --glass-bg-strong: rgba(255,255,255,0.09);
    --glass-border: rgba(255,255,255,0.14);
    --glass-highlight: rgba(255,255,255,0.4);
    --text-1:#f6f6f2;
    --text-2: rgba(246,246,242,0.66);
    --text-3: rgba(246,246,242,0.44);
    --accent:#ffd400;
    --accent-2:#ffe066;
    --ink-on-accent:#15140c;
    --shadow: 0 24px 70px rgba(0,0,0,0.5);
    --blur:22px;
    --radius-lg:26px;
    --radius-md:18px;
    --radius-sm:12px;
    --focus: 0 0 0 3px rgba(255,212,0,0.55);
    color-scheme: dark;
  }

  html[data-theme="light"]{
    --bg:#f3f3ef;
    --bg-soft:#ffffff;
    --glass-bg: rgba(255,255,255,0.55);
    --glass-bg-strong: rgba(255,255,255,0.75);
    --glass-border: rgba(20,20,15,0.10);
    --glass-highlight: rgba(255,255,255,0.9);
    --text-1:#15140c;
    --text-2: rgba(21,20,12,0.68);
    --text-3: rgba(21,20,12,0.46);
    --accent:#e3ab00;
    --accent-2:#f0c23a;
    --ink-on-accent:#15140c;
    --shadow: 0 24px 60px rgba(20,20,15,0.14);
    color-scheme: light;
  }

  html[data-theme="contrast"]{
    --bg:#000000;
    --bg-soft:#000000;
    --glass-bg:#000000;
    --glass-bg-strong:#000000;
    --glass-border:#ffe400;
    --glass-highlight: transparent;
    --text-1:#ffffff;
    --text-2:#ffffff;
    --text-3:#ffffff;
    --accent:#ffe400;
    --accent-2:#ffe400;
    --ink-on-accent:#000000;
    --shadow:none;
    --blur:0px;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  body{
    margin:0;
    background:var(--bg);
    color:var(--text-1);
    font-family:'Inter', -apple-system, "Segoe UI", "Noto Naskh Arabic", "Noto Nastaliq Urdu", "Noto Sans Devanagari", "Noto Sans SC", sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    transition: background 0.35s ease, color 0.35s ease;
  }

  html[dir="rtl"] body{ direction:rtl; }

  h1,h2,h3{
    font-family:'Sora', 'Inter', sans-serif;
    letter-spacing:-0.01em;
    margin:0;
    color:var(--text-1);
  }

  a{ color:inherit; text-decoration:none; }
  ul{ margin:0; padding:0; list-style:none; }
  button{ font-family:inherit; cursor:pointer; }

  :focus-visible{ outline:none; box-shadow:var(--focus); border-radius:8px; }

  .wrap{ max-width:1180px; margin:0 auto; padding:0 28px; }

  /* ==========================================================
     BACKGROUND DECOR
     ========================================================== */
  .bg-decor{
    position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
  }
  .bg-decor span{
    position:absolute; border-radius:50%; filter:blur(90px); opacity:0.35;
  }
  .bg-decor span:nth-child(1){ width:520px;height:520px; background:var(--accent); top:-180px; left:-140px; opacity:0.18;}
  .bg-decor span:nth-child(2){ width:420px;height:420px; background:#7fa1ff; top:220px; right:-160px; opacity:0.10;}
  .bg-decor span:nth-child(3){ width:380px;height:380px; background:var(--accent); bottom:-160px; left:30%; opacity:0.10;}
  html[data-theme="contrast"] .bg-decor{ display:none; }

  /* ==========================================================
     GLASS
     ========================================================== */
  .glass{
    background:var(--glass-bg);
    border:1px solid var(--glass-border);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(160%);
    backdrop-filter: blur(var(--blur)) saturate(160%);
    box-shadow:var(--shadow);
    position:relative;
    border-radius:var(--radius-lg);
  }
  .glass::before{
    content:"";
    position:absolute; inset:0 0 auto 0; height:1px;
    background:linear-gradient(90deg, transparent, var(--glass-highlight), transparent);
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
  }
  html[data-theme="contrast"] .glass{ border-width:2px; }
  html[data-theme="contrast"] .glass::before{ display:none; }

  /* ==========================================================
     HEADER
     ========================================================== */
  .site-header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    gap:20px; padding:14px 28px; margin:14px 14px 0;
    border-radius:20px;
  }
  html[data-theme="contrast"] .site-header{ position:static; }

  .brand{ display:flex; align-items:center; gap:12px; min-width:0; }
  .brand-mark{
    width:38px; height:38px; border-radius:11px; flex:none;
    background:linear-gradient(155deg, var(--accent), var(--accent-2));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 18px rgba(255,212,0,0.35);
  }
  html[data-theme="contrast"] .brand-mark{ box-shadow:none; border:2px solid #fff; }
  .brand-mark svg{ width:20px; height:20px; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.1; min-width:0; }
  .brand-name{ font-family:'Sora',sans-serif; font-weight:800; font-size:16px; letter-spacing:-0.01em; }
  .brand-by{ font-size:11px; color:var(--text-3); }

  .main-nav{ display:flex; align-items:center; gap:28px; }
  .main-nav a{ font-size:14.5px; font-weight:500; color:var(--text-2); transition:color .2s ease; white-space:nowrap;}
  .main-nav a:hover{ color:var(--text-1); }

  .controls{ display:flex; align-items:center; gap:12px; }

  .theme-switch{
    display:flex; align-items:center; gap:2px; padding:4px;
    border-radius:999px; border:1px solid var(--glass-border);
    background:var(--glass-bg-strong);
  }
  .theme-switch button{
    width:30px; height:30px; border-radius:999px; border:none; background:transparent;
    color:var(--text-2); display:flex; align-items:center; justify-content:center;
    font-size:14px; transition: background .2s ease, color .2s ease;
  }
  .theme-switch button[aria-pressed="true"]{ background:var(--accent); color:var(--ink-on-accent); }
  html[data-theme="contrast"] .theme-switch button[aria-pressed="true"]{ outline:2px solid #fff; }

  #langSelect{
    appearance:none; -webkit-appearance:none;
    border:1px solid var(--glass-border); background:var(--glass-bg-strong);
    color:var(--text-1); font-size:13px; font-weight:600; padding:8px 30px 8px 14px;
    border-radius:999px; cursor:pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
    background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%;
    background-size: 5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  html[dir="rtl"] #langSelect{
    padding:8px 14px 8px 30px;
    background-position: 16px 55%, 11px 55%;
  }

  .nav-toggle{ display:none; width:38px;height:38px; border-radius:10px; border:1px solid var(--glass-border); background:var(--glass-bg-strong); color:var(--text-1); }

  /* ==========================================================
     HERO
     ========================================================== */
  .hero{
    display:grid; grid-template-columns:1.05fr 0.95fr; gap:56px; align-items:center;
    padding:96px 28px 70px; max-width:1180px; margin:0 auto;
  }
  .hero-copy h1{ font-size:clamp(34px, 4.6vw, 56px); font-weight:800; line-height:1.06; }
  .hero-copy p{ margin-top:22px; font-size:17px; color:var(--text-2); max-width:52ch; }
  .hero-actions{ display:flex; align-items:center; gap:14px; margin-top:34px; flex-wrap:wrap; }

  .btn{
    display:inline-flex; align-items:center; gap:10px; justify-content:center;
    padding:14px 24px; border-radius:999px; font-weight:700; font-size:15px;
    border:1px solid transparent; transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
    white-space:nowrap;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:var(--accent); color:var(--ink-on-accent); box-shadow:0 14px 34px rgba(255,212,0,0.30); }
  .btn-primary:hover{ box-shadow:0 18px 42px rgba(255,212,0,0.42); }
  html[data-theme="contrast"] .btn-primary{ box-shadow:none; border:2px solid #fff; }
  .btn-ghost{ background:var(--glass-bg-strong); color:var(--text-1); border-color:var(--glass-border); }
  .btn-ghost:hover{ background:var(--glass-bg); }
  .btn-lg{ padding:17px 34px; font-size:16px; }

  .hero-visual{ height:380px; padding:26px; overflow:hidden; }
  .hero-visual svg{ width:100%; height:100%; display:block; }

  .beam-dash{ stroke-dasharray:6 10; animation:dashmove 2.4s linear infinite; }
  .pulse-dot{ animation:pulse 2.4s ease-in-out infinite; transform-origin:center; }
  @keyframes dashmove{ to{ stroke-dashoffset:-160; } }
  @keyframes pulse{ 0%,100%{ opacity:.25; transform:scale(0.9);} 50%{ opacity:1; transform:scale(1.15);} }

  /* ==========================================================
     STEPS
     ========================================================== */
  .steps{ padding:10px 28px 90px; max-width:1180px; margin:0 auto; }
  .steps h2{ font-size:26px; font-weight:800; margin-bottom:34px; text-align:center; }
  .steps-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
  .step-card{ padding:26px 24px; border-radius:var(--radius-md); }
  .step-num{
    width:34px;height:34px; border-radius:10px; background:var(--accent); color:var(--ink-on-accent);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; margin-bottom:16px;
  }
  html[data-theme="contrast"] .step-num{ border:2px solid #fff; }
  .step-card h3{ font-size:16.5px; font-weight:700; margin-bottom:8px; }
  .step-card p{ margin:0; font-size:14.5px; color:var(--text-2); }

  /* ==========================================================
     FEATURES
     ========================================================== */
  .features{ padding:20px 28px 100px; max-width:1180px; margin:0 auto; }
  .section-head{ max-width:640px; margin:0 auto 56px; text-align:center; }
  .section-head h2{ font-size:clamp(26px,3vw,36px); font-weight:800; }
  .section-head p{ margin-top:14px; color:var(--text-2); font-size:16px; }

  .feature-category{ margin-bottom:52px; }
  .feature-category:last-child{ margin-bottom:0; }
  .feature-category h3{
    font-size:13px; font-weight:700; text-transform:none; color:var(--text-3);
    margin-bottom:18px; padding-inline-start:2px;
    border-inline-start:3px solid var(--accent); padding-inline-start:12px;
  }
  .feature-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:16px; }
  .feature-card{ padding:22px; border-radius:var(--radius-md); }
  .feature-card h4{ font-family:'Sora',sans-serif; font-size:15.5px; font-weight:700; margin-bottom:8px; }
  .feature-card p{ margin:0; font-size:14px; color:var(--text-2); }

  /* ==========================================================
     DOWNLOAD CTA
     ========================================================== */
  .download-cta{
    max-width:1180px; margin:0 28px 100px; margin-inline:auto;
    padding:64px 40px; text-align:center;
    background: linear-gradient(160deg, var(--glass-bg-strong), var(--glass-bg));
  }
  .download-cta h2{ font-size:clamp(26px,3.2vw,38px); font-weight:800; }
  .download-cta p{ margin:14px 0 30px; color:var(--text-2); font-size:16px; }

  /* ==========================================================
     CONNECT
     ========================================================== */
  .connect{ padding:0 28px 110px; max-width:1180px; margin:0 auto; }
  .connect-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:18px; }
  .connect-card{
    padding:26px; display:flex; flex-direction:column; gap:14px;
    transition: transform .2s ease;
  }
  .connect-card:hover{ transform:translateY(-4px); }
  .connect-icon{
    width:44px;height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:var(--ink-on-accent); flex:none;
  }
  html[data-theme="contrast"] .connect-icon{ border:2px solid #fff; }
  .connect-icon svg{ width:22px; height:22px; }
  .connect-card h4{ font-family:'Sora',sans-serif; font-size:16px; font-weight:700; }
  .connect-card p{ margin:0; font-size:13.5px; color:var(--text-2); }

  /* ==========================================================
     FOOTER
     ========================================================== */
  .site-footer{
    padding:30px 28px 44px; max-width:1180px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    border-top:1px solid var(--glass-border); font-size:13px; color:var(--text-3);
  }

  /* ==========================================================
     RESPONSIVE
     ========================================================== */
  @media (max-width: 900px){
    .hero{ grid-template-columns:1fr; padding-top:120px; }
    .hero-visual{ order:-1; height:260px; }
    .steps-row{ grid-template-columns:1fr; }
    .connect-grid{ grid-template-columns:1fr; }
    .main-nav{
      position:absolute; top:70px; inset-inline:14px; flex-direction:column; align-items:flex-start;
      padding:18px 20px; border-radius:18px; gap:16px;
      background:var(--glass-bg-strong); border:1px solid var(--glass-border);
      -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
      display:none;
    }
    .main-nav.open{ display:flex; }
    .nav-toggle{ display:flex; align-items:center; justify-content:center; }
  }
  @media (max-width: 560px){
    .wrap{ padding:0 18px; }
    .site-header{ margin:10px 10px 0; padding:12px 16px; }
    .controls{ gap:8px; }
    .hero{ padding:110px 18px 50px; }
  }
</style>
</head>
<body>

<div class="bg-decor" aria-hidden="true"><span></span><span></span><span></span></div>

<header class="site-header glass">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12L11 5M4 12L11 19M4 12H16M20 12a4 4 0 100-8 4 4 0 000 8zm0 12a4 4 0 100-8 4 4 0 000 8z" stroke="#15140c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">WE SHARE</span>
      <span class="brand-by">by Answare</span>
    </div>
  </div>

  <button class="nav-toggle glass" id="navToggle" aria-label="Menu" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>

  <nav class="main-nav" id="mainNav">
    <a href="#home" data-i18n="nav.home"></a>
    <a href="#features" data-i18n="nav.features"></a>
    <a href="#download" data-i18n="nav.download"></a>
    <a href="#connect" data-i18n="nav.connect"></a>
  </nav>

  <div class="controls">
    <div class="theme-switch" role="group" aria-label="Theme">
      <button data-theme-btn="light" aria-pressed="false" aria-label="Light theme">☀</button>
      <button data-theme-btn="dark" aria-pressed="true" aria-label="Dark theme">●</button>
      <button data-theme-btn="contrast" aria-pressed="false" aria-label="High contrast theme">◐</button>
    </div>
    <select id="langSelect" aria-label="Language">
      <option value="en">English</option>
      <option value="ar">العربية</option>
      <option value="ur">اردو</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="hi">हिन्दी</option>
      <option value="zh">中文</option>
    </select>
  </div>
</header>

<main>

  <section id="home" class="hero">
    <div class="hero-copy">
      <h1 id="heroTitle"></h1>
      <p id="heroSubtitle"></p>
      <div class="hero-actions">
        <a class="btn btn-primary" id="heroDownloadBtn" href="#">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-i18n="hero.ctaDownload"></span>
        </a>
        <a class="btn btn-ghost" id="heroYoutubeBtn" href="#" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M22 12s0-3.2-.4-4.7a2.9 2.9 0 00-2-2C17.9 5 12 5 12 5s-5.9 0-7.6.3a2.9 2.9 0 00-2 2C2 8.8 2 12 2 12s0 3.2.4 4.7a2.9 2.9 0 002 2C6.1 19 12 19 12 19s5.9 0 7.6-.3a2.9 2.9 0 002-2C22 15.2 22 12 22 12z" stroke="currentColor" stroke-width="1.6"/><path d="M10 9l5 3-5 3V9z" fill="currentColor"/></svg>
          <span data-i18n="hero.ctaYoutube"></span>
        </a>
      </div>
    </div>

    <div class="hero-visual glass" aria-hidden="true">
      <svg viewBox="0 0 420 320">
        <!-- laptop -->
        <rect x="18" y="90" width="150" height="100" rx="10" fill="none" stroke="var(--accent)" stroke-width="1.6" opacity="0.85"/>
        <rect x="18" y="196" width="150" height="10" rx="4" fill="var(--accent)" opacity="0.5"/>
        <rect x="34" y="106" width="118" height="68" rx="4" fill="var(--accent)" opacity="0.10"/>
        <!-- phone -->
        <rect x="300" y="60" width="90" height="180" rx="16" fill="none" stroke="var(--accent)" stroke-width="1.6" opacity="0.85"/>
        <rect x="312" y="76" width="66" height="148" rx="4" fill="var(--accent)" opacity="0.10"/>
        <!-- QR on phone -->
        <g transform="translate(324,96)" opacity="0.9">
          <rect x="0" y="0" width="42" height="42" fill="none" stroke="var(--accent)" stroke-width="1.2"/>
          <rect x="4" y="4" width="10" height="10" fill="var(--accent)"/>
          <rect x="28" y="4" width="10" height="10" fill="var(--accent)"/>
          <rect x="4" y="28" width="10" height="10" fill="var(--accent)"/>
          <rect x="18" y="18" width="6" height="6" fill="var(--accent)"/>
          <rect x="28" y="28" width="6" height="6" fill="var(--accent)"/>
        </g>
        <!-- beam -->
        <path class="beam-dash" d="M170 130 C 220 90, 250 170, 298 140" fill="none" stroke="var(--accent)" stroke-width="2"/>
        <circle class="pulse-dot" cx="298" cy="140" r="5" fill="var(--accent)"/>
      </svg>
    </div>
  </section>

  <section class="steps">
    <h2 id="stepsTitle"></h2>
    <div class="steps-row" id="stepsRow"></div>
  </section>

  <section id="features" class="features">
    <div class="section-head">
      <h2 id="featuresTitle"></h2>
      <p id="featuresSubtitle"></p>
    </div>
    <div id="featuresCategories"></div>
  </section>

  <section id="download" class="download-cta glass">
    <h2 id="downloadTitle"></h2>
    <p id="downloadSubtitle"></p>
    <a class="btn btn-primary btn-lg" id="downloadCtaBtn" href="#">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span id="downloadCtaLabel"></span>
    </a>
  </section>

  <section id="connect" class="connect">
    <div class="section-head">
      <h2 id="connectTitle"></h2>
      <p id="connectSubtitle"></p>
    </div>
    <div class="connect-grid">
      <a class="connect-card glass" id="youtubeCard" href="#" target="_blank" rel="noopener">
        <div class="connect-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M22 12s0-3.2-.4-4.7a2.9 2.9 0 00-2-2C17.9 5 12 5 12 5s-5.9 0-7.6.3a2.9 2.9 0 00-2 2C2 8.8 2 12 2 12s0 3.2.4 4.7a2.9 2.9 0 002 2C6.1 19 12 19 12 19s5.9 0 7.6-.3a2.9 2.9 0 002-2C22 15.2 22 12 22 12z" stroke="currentColor" stroke-width="1.6"/><path d="M10 9l5 3-5 3V9z" fill="currentColor"/></svg>
        </div>
        <h4 id="youtubeLabel"></h4>
        <p id="youtubeDesc"></p>
      </a>
      <a class="connect-card glass" id="instagramCard" href="#" target="_blank" rel="noopener">
        <div class="connect-icon">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="5" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/><circle cx="17.2" cy="6.8" r="1.2" fill="currentColor"/></svg>
        </div>
        <h4 id="instagramLabel"></h4>
        <p id="instagramDesc"></p>
      </a>

const RTL_LANGS = ["ar","ur"];
const STORAGE_LANG = "weshare_lang";
const STORAGE_THEME = "weshare_theme";

function applyConfig(){
  document.getElementById("heroDownloadBtn").href = CONFIG.downloadUrl;
  document.getElementById("downloadCtaBtn").href = CONFIG.downloadUrl;
  document.getElementById("heroYoutubeBtn").href = CONFIG.youtubeUrl;
  document.getElementById("youtubeCard").href = CONFIG.youtubeUrl;
  document.getElementById("instagramCard").href = CONFIG.instagramUrl;
  document.getElementById("emailCard").href = "mailto:" + CONFIG.emailAddress;
}

function renderFeatureCategories(list){
  const host = document.getElementById("featuresCategories");
  host.innerHTML = "";
  list.forEach(cat=>{
    const section = document.createElement("div");
    section.className = "feature-category";
    const h3 = document.createElement("h3");
    h3.textContent = cat.title;
    const grid = document.createElement("div");
    grid.className = "feature-grid";
    cat.items.forEach(item=>{
      const card = document.createElement("div");
      card.className = "feature-card glass";
      const h4 = document.createElement("h4");
      h4.textContent = item.t;
      const p = document.createElement("p");
      p.textContent = item.d;
      card.appendChild(h4);
      card.appendChild(p);
      grid.appendChild(card);
    });
    section.appendChild(h3);
    section.appendChild(grid);
    host.appendChild(section);
  });
}

function renderSteps(list){
  const host = document.getElementById("stepsRow");
  host.innerHTML = "";
  list.forEach((item,i)=>{
    const card = document.createElement("div");
    card.className = "step-card glass";
    card.innerHTML = '<div class="step-num">' + (i+1) + '</div><h3></h3><p></p>';
    card.querySelector("h3").textContent = item.t;
    card.querySelector("p").textContent = item.d;
    host.appendChild(card);
  });
}

function setLanguage(lang){
  const dict = I18N[lang] || I18N.en;
  document.documentElement.lang = lang;
  document.documentElement.dir = RTL_LANGS.includes(lang) ? "rtl" : "ltr";
  document.getElementById("langSelect").value = lang;

  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const path = el.getAttribute("data-i18n").split(".");
    let val = dict;
    path.forEach(p=>{ val = val ? val[p] : null; });
    if (val) el.textContent = val;
  });

  document.getElementById("heroTitle").textContent = dict.hero.title;
  document.getElementById("heroSubtitle").textContent = dict.hero.subtitle;
  document.getElementById("stepsTitle").textContent = dict.steps.title;
  renderSteps(dict.steps.items);

  document.getElementById("featuresTitle").textContent = dict.features.title;
  document.getElementById("featuresSubtitle").textContent = dict.features.subtitle;
  renderFeatureCategories(dict.features.categories);

  document.getElementById("downloadTitle").textContent = dict.download.title;
  document.getElementById("downloadSubtitle").textContent = dict.download.subtitle;
  document.getElementById("downloadCtaLabel").textContent = dict.download.cta;

  document.getElementById("connectTitle").textContent = dict.connect.title;
  document.getElementById("connectSubtitle").textContent = dict.connect.subtitle;
  document.getElementById("youtubeLabel").textContent = dict.connect.youtube;
  document.getElementById("youtubeDesc").textContent = dict.connect.youtubeDesc;
  document.getElementById("instagramLabel").textContent = dict.connect.instagram;
  document.getElementById("instagramDesc").textContent = dict.connect.instagramDesc;
  document.getElementById("emailLabel").textContent = dict.connect.email;
  document.getElementById("emailDesc").textContent = dict.connect.emailDesc;

  document.getElementById("footerRights").textContent = dict.footer.rights;

  try{ localStorage.setItem(STORAGE_LANG, lang); }catch(e){}
}

function setTheme(theme){
  document.documentElement.setAttribute("data-theme", theme);
  document.querySelectorAll("[data-theme-btn]").forEach(btn=>{
    btn.setAttribute("aria-pressed", btn.getAttribute("data-theme-btn") === theme ? "true" : "false");
  });
  try{ localStorage.setItem(STORAGE_THEME, theme); }catch(e){}
}

document.addEventListener("DOMContentLoaded", function(){
  document.getElementById("footerYear").textContent = "© " + new Date().getFullYear();
  applyConfig();

  let savedLang = "en", savedTheme = "dark";
  try{
    savedLang = localStorage.getItem(STORAGE_LANG) || (I18N[navigator.language?.slice(0,2)] ? navigator.language.slice(0,2) : "en");
    savedTheme = localStorage.getItem(STORAGE_THEME) || "dark";
  }catch(e){}

  setLanguage(I18N[savedLang] ? savedLang : "en");
  setTheme(savedTheme);

  document.getElementById("langSelect").addEventListener("change", e=> setLanguage(e.target.value));
  document.querySelectorAll("[data-theme-btn]").forEach(btn=>{
    btn.addEventListener("click", ()=> setTheme(btn.getAttribute("data-theme-btn")));
  });

  const navToggle = document.getElementById("navToggle");
  const mainNav = document.getElementById("mainNav");
  navToggle.addEventListener("click", ()=>{
    const open = mainNav.classList.toggle("open");
    navToggle.setAttribute("aria-expanded", open ? "true" : "false");
  });
  mainNav.querySelectorAll("a").forEach(a=> a.addEventListener("click", ()=>{
    mainNav.classList.remove("open");
    navToggle.setAttribute("aria-expanded","false");
  }));
});
</script>
</body>
</html>
